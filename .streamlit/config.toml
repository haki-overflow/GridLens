# GridLens base theme: KiCad-style dark. theme.css (injected by ui_theme.py)
# does the detailed styling with the same palette.
[theme]
base = "dark"
primaryColor = "#8A9099"
backgroundColor = "#33363C"
secondaryBackgroundColor = "#3B3F45"
textColor = "#C8CCD0"
font = "sans serif"
baseFontSize = 13
baseRadius = "2px"
buttonRadius = "2px"
showWidgetBorder = true
showSidebarBorder = true
borderColor = "#575C64"
dataframeHeaderBackgroundColor = "#464A51"
dataframeBorderColor = "#575C64"
headingFontSizes = ["16px", "14px", "13px", "13px", "12px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#373A40"
secondaryBackgroundColor = "#3B3F45"
textColor = "#C8CCD0"
borderColor = "#575C64"

[client]
toolbarMode = "minimal"
